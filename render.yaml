databases:
  - name: job-crm-db
    plan: free
    databaseName: crm
    user: crm
    postgresMajorVersion: 16

services:
  - type: web
    name: job-crm-backend
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/dominikmodrzejewski99/job-crm
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      # Render's `connectionString` property returns `postgres://...` which
      # HikariCP rejects ("URL must start with 'jdbc'"). Build the JDBC URL
      # from the discrete fields in application-prod.yml instead.
      - key: DB_HOST
        fromDatabase:
          name: job-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: job-crm-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: job-crm-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: job-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: job-crm-db
          property: password
      # Render generates a strong random value on first deploy and surfaces it
      # in the dashboard so devs can rotate by editing the env var.
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        sync: false   # Set in Render UI to Resend / Mailtrap / SES SMTP host
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: noreply@jobtrack.local
      # Optional kill-switch for the JJIT/NFJ crawler — set to false if you
      # don't want the free tier to burn cycles on outbound HTTP.
      - key: JOBBOARD_ENABLED
        value: "true"
