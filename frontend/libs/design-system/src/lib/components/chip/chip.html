<ng-content />
@if (removable()) {
  <button
    type="button"
    class="ds-chip__remove"
    [attr.aria-label]="removeAriaLabel()"
    (click)="remove.emit()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6L6 18" />
      <path d="M6 6l12 12" />
    </svg>
  </button>
}
