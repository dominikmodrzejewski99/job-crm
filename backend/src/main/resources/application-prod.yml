# Production profile — JDBC URL built from discrete env vars (Render's
# `connectionString` is in postgres:// form which HikariCP rejects).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health  # tighter than dev — no /info or /metrics in prod
  # MAIL_* env vars are optional (sync: false in render.yaml) so SMTP
  # credentials may not be configured. Without disabling the mail health
  # indicator the actuator endpoint returns 503 on every probe, which
  # makes Render mark the deploy as failed even though the app itself is
  # serving fine. Re-enable once Resend/SendGrid creds are provisioned.
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    pl.dmod.crm: INFO
    org.springframework.security: WARN
