spring:
  jpa:
    show-sql: false
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health  # tighter than dev — no /info or /metrics in prod

logging:
  level:
    root: INFO
    pl.dmod.crm: INFO
    org.springframework.security: WARN
