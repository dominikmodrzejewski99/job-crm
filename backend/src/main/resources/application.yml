spring:
  application:
    name: crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  # Render injects PORT automatically (defaults to 10000) — its router
  # probes that port for the health check, so we must bind to it. Local
  # dev / Docker compose keep using 8080 via the fallback chain.
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    pl.dmod.crm: DEBUG

jobtrack:
  auth:
    jwt:
      # Must be at least 32 characters for HS256. Override via env in prod.
      secret: ${JWT_SECRET:dev-only-please-change-me-to-something-long-32+chars}
      validity: PT1H
      issuer: jobtrack
  followup:
    initial-delay-ms: 30000
    fixed-delay-ms: 300000     # 5 minutes between reminder scans
    from: ${MAIL_FROM:noreply@jobtrack.local}
  jobboard:
    enabled: ${JOBBOARD_ENABLED:true}
    initial-delay-ms: 60000
    fixed-delay-ms: 21600000   # 6 hours between crawler runs
    justjoin:
      base-url: ${JJIT_BASE_URL:https://justjoin.it}
      offers-path: /api/offers
      limit: 50
    nofluff:
      base-url: ${NFJ_BASE_URL:https://nofluffjobs.com}
      postings-path: /api/posting
      limit: 50
